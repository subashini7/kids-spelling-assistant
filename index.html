<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spelling Assistant</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="/kids-spelling-assistant/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/kids-spelling-assistant/icons/icon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/kids-spelling-assistant/icons/icon-192x192.png">
</head>
<body>
  <main class="app-shell">
    <header>
      <h1>Spelling Assistant</h1>
      <p class="subtitle">Listen, type, and improve spelling with instant feedback.</p>
      <div id="status" class="status">Loading model...</div>
    </header>

    <section class="card">
      <label id="title" for="child-name">Enter your name</label>
      <div class="row">
        <input type="text" id="child-name" spellcheck="false" placeholder="Name">
        <div class="difficulty-stepper" title="Word difficulty level (1 = easiest, 5 = hardest)">
          <span class="diff-label">Level</span>
          <button type="button" id="diff-dec" aria-label="Decrease difficulty">−</button>
          <span id="diff-value" aria-live="polite">2</span>
          <button type="button" id="diff-inc" aria-label="Increase difficulty">+</button>
        </div>
        <button id="submit-name-btn">Start</button>
      </div>
    </section>

    <section id="game-container" class="card">
      <div class="row">
        <button id="hear-btn" disabled>Hear a word</button>
        <button id="hear-ex-btn">Hear an example</button>
        <button id="next-word-btn">Next word</button>
      </div>
      <p id="instruction">Type the word you heard:</p>
      <div class="row">
        <input
          type="search"
          inputmode="text"
          id="child-input"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
        >
        <button id="submit-ans-btn">Check</button>
      </div>
      <div id="celebration" class="celebration" aria-hidden="true"></div>
      <div id="output" class="output"></div>
    </section>
    <section id="daily-summary" class="card">
      <div class="row" style="justify-content: space-between; align-items: center;">
        <h2 style="margin: 0; font-size: 1.1rem;">Today's Summary</h2>
        <button id="show-summary-btn">Show Summary</button>
      </div>
      <div id="daily-summary-content" class="output" style="margin-top: 10px;"></div>
    </section>
  </main>

  <script type="module" src="app.js?v=20260507-1"></script>
  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/kids-spelling-assistant/sw.js")
      .then(() => console.log("Service worker registered"))
      .catch((err) => console.error("SW registration failed:", err));
  }
</script>
</body>
</html>
