<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spelling Assistant</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="manifest" href="/kids-spelling-assistant/manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192x192.png">
</head>
<body>
  <main class="app-shell">
    <header>
      <h1>Spelling Assistant</h1>
      <p class="subtitle">Listen, type, and improve spelling with instant feedback.</p>
      <div id="status" class="status">Loading words...</div>
    </header>

    <!-- Persistent child bar — shows after name is selected -->
    <div id="child-bar" class="child-bar" hidden>
      <span>👤 <strong id="child-bar-name"></strong></span>
      <button type="button" id="child-switch-btn" class="child-switch-btn">Switch child</button>
    </div>

    <nav class="tab-bar">
      <button class="tab-btn is-active" id="tab-btn-practice" type="button">Practice</button>
      <button class="tab-btn" id="tab-btn-learn" type="button">Learn</button>
    </nav>

    <section class="card">
      <label>Select Grade and Level</label>
      <div class="row">
        <div class="grade-selector">
          <button type="button" id="grade-1-btn" class="grade-btn">Grade 1</button>
          <button type="button" id="grade-5-btn" class="grade-btn is-active">Grade 5</button>
          <button type="button" id="uk-11-plus-btn" class="grade-btn">UK 11+</button>
        </div>
        <div class="difficulty-stepper" title="Word difficulty level (1 = easiest, 5 = hardest)">
          <span class="diff-label">Level</span>
          <button type="button" id="diff-dec" aria-label="Decrease difficulty">−</button>
          <span id="diff-value" aria-live="polite">2</span>
          <button type="button" id="diff-inc" aria-label="Increase difficulty">+</button>
        </div>
      </div>
    </section>

    <div id="tab-practice">
      <div id="filter-bar" class="filter-bar" hidden>
        Practicing: <strong id="filter-label"></strong>
        <button id="clear-filter-btn" type="button">All words</button>
      </div>

      <section id="game-container" class="card">
        <div class="row">
          <button id="hear-btn" disabled>Hear a word</button>
          <button id="hear-ex-btn" disabled>Hear an example</button>
          <button id="next-word-btn" disabled>Next word</button>
        </div>
        <p id="instruction">Type the word you heard:</p>
        <div class="row">
          <input
            type="search"
            inputmode="text"
            id="child-input"
            spellcheck="false"
            autocomplete="new-password"
            autocorrect="off"
            autocapitalize="off"
          >
          <button id="submit-ans-btn">Check</button>
        </div>
        <div id="celebration" class="celebration" aria-hidden="true"></div>
        <div id="output" class="output"></div>
      </section>

      <section id="daily-summary" class="card">
        <div class="row" style="justify-content: space-between; align-items: center;">
          <h2 style="margin: 0; font-size: 1.1rem;">Today's Summary</h2>
          <button id="show-summary-btn">Show Summary</button>
        </div>
        <div id="daily-summary-content" class="output" style="margin-top: 10px;"></div>
      </section>
    </div>

    <div id="tab-learn" hidden>
      <p id="learn-prompt" class="learn-prompt">Select a grade above to see your word categories.</p>
      <div id="cat-grid" class="cat-grid"></div>
      <div id="vocab-panel" class="vocab-panel" hidden>
        <div class="vocab-panel-header">
          <span id="vocab-panel-title" class="vocab-panel-title"></span>
          <button id="vocab-close-btn" type="button" class="vocab-close-btn" aria-label="Close">✕</button>
        </div>
        <div id="vocab-panel-content" class="vocab-panel-content"></div>
      </div>
    </div>
  </main>

  <!-- Child picker overlay — shown until a child name is selected -->
  <div id="child-picker-overlay" class="child-overlay" style="display:none">
    <div class="child-overlay-box">
      <h2 class="child-overlay-title">Who&#39;s practising? 🎓</h2>
      <div id="child-list" class="child-list"></div>
      <div class="child-add-row">
        <input type="text" id="new-child-input" placeholder="Enter a name…" maxlength="24"
               autocomplete="off" autocorrect="off" autocapitalize="words">
        <button type="button" id="new-child-btn">Start →</button>
      </div>
    </div>
  </div>

  <footer class="app-version">v2.5 · 2026-06-25</footer>
  <script type="module" src="scripts/app.js?v=20260625-1"></script>
  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/kids-spelling-assistant/sw.js")
      .then(() => console.log("Service worker registered"))
      .catch((err) => console.error("SW registration failed:", err));
  }
</script>
</body>
</html>
